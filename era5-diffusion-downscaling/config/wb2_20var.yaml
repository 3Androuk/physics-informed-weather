# 20-variable WB2 downscaling — 20 input and 20 output channels.
# t2m is channel 0 and the display channel for figures/headline metrics.
# All paths are separate from the single-variable runs so neither data nor
# checkpoints can clobber each other.

seed: 42

paths:
  raw_dir: datasets/raw_wb220
  patch_dir: datasets/patches_wb220
  ckpt_dir: checkpoints_wb220
  results_dir: results_wb220
  log_dir: results_wb220/tb

data:
  era5_zarr: "gs://weatherbench2/datasets/era5/1959-2022-6h-1440x721.zarr"
  gcs_token: anon
  name: wb220                    # short tag for wandb run names
  # 20 channels: 5 surface + {z, t, u, v, q} at 500/700/850 hPa. Channel order
  # here is the channel order everywhere (patches, model, stats, metrics).
  variables:
    - {name: 2m_temperature, level: null}
    - {name: 10m_u_component_of_wind, level: null}
    - {name: 10m_v_component_of_wind, level: null}
    - {name: mean_sea_level_pressure, level: null}
    - {name: total_column_water_vapour, level: null}
    - {name: geopotential, level: 500}
    - {name: geopotential, level: 700}
    - {name: geopotential, level: 850}
    - {name: temperature, level: 500}
    - {name: temperature, level: 700}
    - {name: temperature, level: 850}
    - {name: u_component_of_wind, level: 500}
    - {name: u_component_of_wind, level: 700}
    - {name: u_component_of_wind, level: 850}
    - {name: v_component_of_wind, level: 500}
    - {name: v_component_of_wind, level: 700}
    - {name: v_component_of_wind, level: 850}
    - {name: specific_humidity, level: 500}
    - {name: specific_humidity, level: 700}
    - {name: specific_humidity, level: 850}
  train_years: [2007, 2015]
  test_years: [2016, 2017]
  time_stride: 4                 # every 24h at a fixed hour (avoids diurnal aliasing)

patches:
  size: 128
  per_field: 8                   # NOTE: 20-channel train patches are ~35 GB on
                                 # disk at this setting; halve per_field to halve it.
  lat_range: [-60.0, 60.0]

normalize:
  method: zscore                 # per-CHANNEL mean/std computed on train patches

diffusion:
  timesteps: 1000
  beta_schedule: linear
  beta_start: 1.0e-4
  beta_end: 2.0e-2

transport:
  train_ratios: [2, 4, 8]
  eval_ratios: [4, 8, 16]        # 16x is held out during training
  time_scale: 1000.0
  time_epsilon: 1.0e-4
  sample_steps: 100
  solver: heun
  projection: final
  stochastic_interpolant:
    gamma: 0.5
    score_weight: 1.0
    sampler: ode
    stochasticity: 0.1

unet:
  in_channels: 20                # one channel per data.variables entry
  out_channels: 20
  base_channels: 128             # widened for the 20-channel joint task (~4x the
                                 # single-variable UNet's params; every level stays
                                 # divisible by groupnorm_groups=32)
  channel_mults: [1, 2, 4, 8]
  num_res_blocks: 2
  time_emb_dim: 256
  attn_resolutions: [16]
  dropout: 0.1
  groupnorm_groups: 32

geo:
  enabled: false
  # hash | healpix (learned) | xyz | sinusoidal | static (baselines — see t2m.yaml)
  encoder: hash
  sinusoidal_n_frequencies: 3
  static_fields:
    - geopotential_at_surface
    - land_sea_mask
    - slope_of_sub_gridscale_orography
  # Ladder-MATCHED HEALPix: Nside 8,11,14,20,26,35,48,64 -> 7.33 deg (815 km)
  # down to 0.92 deg (102 km), the same scale band and growth factor (b~1.35)
  # as the hash grid's 16..128, at 218k dense params against the hash's 3.3M.
  # nside_min is what makes it matched — WITHOUT it the default of 1 gives the
  # power-of-two ladder 1,2,...,128, whose three coarsest levels (6520/3260/
  # 1630 km) are at or above the 32 deg patch span and so are near-constant per
  # patch, and whose finest (51 km, <2 ERA5 px) violates this file's own ~150 km
  # cap. That misallocation is the diagnosed cause of the original HEALPix
  # deficit, so leaving nside_min unset reproduces the known-bad result.
  healpix_n_levels: 8
  healpix_nside_min: 8
  healpix_nside_max: 64
  # Index file must be regenerated whenever the ladder changes, or the
  # precomputed neighbours/weights and the tables disagree about resolutions:
  #   python -m data.make_healpix_index --config config/wb2_20var.yaml
  healpix_index: healpix_index_matched.npz
  input_dim: 3
  n_levels: 8
  n_features_per_level: 2
  log2_hashmap_size: 19
  base_resolution: 16
  finest_resolution: 128
  altitude: null
  # Noise-dependent level gating (--gated): multiply embedding level l by
  # sigmoid((u - c_l) / width) where u is the signal fraction (DDPM: 1 - t/T;
  # transport: t) and c_l = l/(L-1) * c_max — fine levels fade out at high
  # noise so early denoising can't lean on (memorize) fine-scale features.
  # Zero parameters; applies to leveled encoders (hash, healpix, hash_static —
  # static tail stays ungated). Checkpoint suffix gains "_gated".
  level_gating: false
  gating_c_max: 0.6                # threshold of the finest level (coarsest = 0)
  gating_width: 0.1                # sigmoid softness

residual:
  train_ratios: [2, 4, 8]
  n_steps: 100

train:
  # LADDER CONSTANT for ALL 20-var arms on BriCS: global batch 128 = 32 per
  # process x 4 GH200s. batch_size is PER PROCESS under torchrun, so the binding
  # quantity is the GLOBAL batch — the same 32 on one GPU is global 32, a
  # different experiment. Every arm must use 32 AND 4 GPUs or the comparison is
  # confounded by batch, which changes optimizer steps per epoch and gradient
  # noise, hence converged quality.
  #
  # Measured on a 96 GB GH200 (scripts/bench_batch.py, flow+geo, bf16): batch 32
  # = 24.9 GiB and 139 samp/s; 96 = 68 GiB and 163 samp/s. The extra 17% is not
  # worth it — 96 would make the global batch 384 against the 80 this lr was
  # tuned at, and 2e-4 already collapsed this model. 32 keeps ~200 epochs near
  # 3 h on one node, inside the 24 h walltime.
  #
  # The previous constant was 20, set by a 24 GB card that no longer applies;
  # no 20-var checkpoints existed when it changed.
  batch_size: 32
  epochs: 200
  lr: 1.0e-4                     # 2e-4 (the width-64 value) collapses the width-128
                                 # model to the trivial loss=1 solution by epoch ~2;
                                 # halved with the standard width scaling
  weight_decay: 0.0
  grad_clip: 1.0
  amp: false
  # off | fp16 | bf16 (CLI: --amp-dtype). Part of the ladder constant: bf16 for
  # every arm. Measured +51% throughput over fp32 at matched batch (182.9 vs
  # 121.0 samp/s) with LESS memory, and unlike a bigger batch it does not touch
  # the optimization regime. Legacy `amp: true` above still means fp16.
  amp_dtype: bf16
  ema_decay: 0.999
  num_workers: 4
  log_every: 50
  val_patches: 256
  ckpt_every_epochs: 1
  sample_every_epochs: 10

directmap:
  train_ratio: 4
  batch_size: 20
  epochs: 200
  lr: 1.0e-4                     # 2e-4 (the width-64 value) collapses the width-128
                                 # model to the trivial loss=1 solution by epoch ~2;
                                 # halved with the standard width scaling
  grad_clip: 1.0
  amp: false

sample:
  ddim_eta: 0.0
  guidance_strength: 0.0
  interp: nearest
  reconstructions:
    - ratio: 4
      K: 3
      t_steps: [160, 114, 80]
      smooth_sigma: 0.0
    - ratio: 8
      K: 1
      t_steps: [320]
      smooth_sigma: 5.0

eval:
  n_test_patches: 256
  display_channel: 0             # t2m: figures + headline physical-unit metrics
  spectrum_bins: null
  hist_bins: 100

wandb:
  enabled: false
  project: era5-diffusion-downscaling
  entity: null
  name: null
