# DLWP-HPX backbone (Karlbauer et al. 2024) for ERA5 super-resolution.
#
# DEFAULT = the comparison setup: t2m at the SAME resolution/split as the
# era5-diffusion-downscaling models it will be compared against (0.25 deg
# WB2 store, train 2007-2015 / test 2016-2017, stride 4), remapped to
# HPX256 (~0.23 deg, the HEALPix match of 0.25 deg). ratio 4 then
# reproduces that project's 0.25 -> 1 deg task. For a pressure-level
# variable instead (e.g. Z500), set variable: geopotential, level: 500.
# For the lighter/coarser t2m experiment use config/t2m_hpx64.yaml.

seed: 42

paths:
  hpx_dir: datasets/hpx_t2m_256    # remapped HEALPix face arrays + norm stats
  ckpt_dir: checkpoints/t2m_hpx256
  results_dir: results/t2m_hpx256

data:
  # Same 0.25 deg store and time split as era5-diffusion-downscaling.
  # Full globe (no lat band: the HEALPix mesh needs the poles).
  # Transfer ~17GB streamed; ~13GB of face arrays kept on disk.
  era5_zarr: "gs://weatherbench2/datasets/era5/1959-2022-6h-1440x721.zarr"
  gcs_token: anon
  variable: 2m_temperature       # t2m; set geopotential + level for Z500 etc.
  level: null                    # pressure level for level variables, else null
  units: "K"                     # label used in logs/metrics/figures
  train_years: [2007, 2015]
  test_years: [2016, 2017]
  time_stride: 4                 # every Nth 6-hourly step -> daily samples

hpx:
  nside: 256                     # 12x256x256 = 786,432 pixels, ~0.23 deg

sr:
  ratio: 4                       # HPX256 -> HPX64 (~0.92 deg), like 0.25 -> 1 deg

model:
  in_channels: 1
  out_channels: 1
  channels: [64, 128, 256]       # per U-Net level (face 256 -> 128 -> 64)
  dilations: [1, 2, 4]           # conv dilation per level, as in DLWP-HPX
  blocks_per_level: 2            # ConvNeXt blocks per encoder/decoder level
  expansion: 4                   # pointwise MLP expansion inside each block
  gelu_cap: 10.0                 # capped GELU, as in DLWP-HPX
  global_residual: true          # predict a correction to the upsampled input
  grad_checkpoint: true          # recompute activations: HPX256 on 8GB GPUs

train:
  batch_size: 2                  # one sample = the whole globe (12x256x256);
                                 # 2 fits 8GB with grad_checkpoint, raise on bigger GPUs
  accum_steps: 1                 # micro-batches accumulated per optimizer step;
                                 # effective batch = batch_size * accum_steps.
                                 # 24GB cards: batch_size 2 + accum_steps 4 gives
                                 # effective batch 8 in batch-2 memory (batch 4+
                                 # in one pass OOMs — the level-1 expansion MLP
                                 # peaks ~4GB per sample at fp32)
  epochs: 50
  lr: 2.0e-4
  weight_decay: 1.0e-5
  cosine_lr: true
  grad_clip: 1.0
  amp: false                     # fp32 by default (fp16 NaN'ed in the sibling project)
  val_fraction: 0.1              # time-ordered tail of the train years
  num_workers: 4
  log_every: 50
  ckpt_every_epochs: 1           # atomic overwrite; a crash loses at most one epoch

eval:
  checkpoint: best.pt            # which checkpoint eval/evaluate_sr.py loads
  n_test_samples: null           # null -> the whole test split
  hist_bins: 100
  n_map_samples: 3               # global map figures rendered per run
  lat_bands: [[-90, -60], [-60, -20], [-20, 20], [20, 60], [60, 90]]

# Weights & Biases (opt-in). Set enabled: true, or pass --wandb.
wandb:
  enabled: false
  project: dlwp-hpx-sr
  entity: null                   # null -> your default wandb entity
  name: null                     # null -> wandb auto-generates a run name
