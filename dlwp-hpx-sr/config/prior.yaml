# Sphere-native UNCONDITIONAL diffusion prior (Shu et al. 2023 style).
#
# Trained on high-resolution HEALPix fields only — no low-resolution input, no
# degradation ratio anywhere in training. Super-resolution happens entirely at
# inference (eval/evaluate_guided.py) via noise-mixing + intermediate-start
# DDIM with the exact mesh data-consistency projection.
#
# This is the arm that should survive unseen ratios: on this project's own data
# at 8x, both ratio-4-trained regressors collapse (patch direct map 1.23, mesh
# 1.26, vs bicubic 0.96) while patch guided diffusion holds 0.77.

seed: 42

paths:
  hpx_dir: datasets/hpx_t2m_256      # shared with config/default.yaml
  ckpt_dir: checkpoints/t2m_hpx256_prior
  results_dir: results/t2m_hpx256_prior

data:
  era5_zarr: "gs://weatherbench2/datasets/era5/1959-2022-6h-1440x721.zarr"
  gcs_token: anon
  variable: 2m_temperature
  level: null
  units: "K"
  train_years: [2007, 2015]
  test_years: [2016, 2017]
  time_stride: 4

hpx:
  nside: 256

sr:
  ratio: 4                           # only a default for tools that need one;
                                     # the prior itself is ratio-agnostic

diffusion:
  timesteps: 1000
  beta_schedule: linear              # matches the sibling guided-diffusion runs
  beta_start: 1.0e-4
  beta_end: 2.0e-2

model:
  in_channels: 1
  out_channels: 1                    # predicts the noise
  channels: [64, 128, 256]
  dilations: [1, 2, 4]
  blocks_per_level: 2
  expansion: 4
  gelu_cap: 10.0
  global_residual: false             # meaningless for a noise predictor
  grad_checkpoint: true

train:
  batch_size: 2
  accum_steps: 4                     # effective batch 8
  epochs: 100
  lr: 2.0e-4
  weight_decay: 1.0e-5
  cosine_lr: true
  grad_clip: 1.0
  amp: false                         # true + bfloat16 is safe on Ampere/Hopper
  amp_dtype: bfloat16                # never float16
  ema_decay: 0.999                   # reconstruction uses the EMA weights
  val_fraction: 0.1
  num_workers: 4
  log_every: 50
  ckpt_every_epochs: 1

# Guided reconstruction. The SAME checkpoint serves every ratio; only the
# guidance field and the (K, t_steps) schedule change. The 4x and 8x entries
# copy the sibling project's tuned values so the two studies stay comparable;
# 16x is unvalidated (extrapolating their t0 ~ ratio trend) and is exactly the
# held-out ratio the prior is supposed to handle without retraining.
sample:
  eta: 0.0                           # deterministic DDIM
  stride: 1                          # timestep subsequence stride
  project: true                      # exact mesh data-consistency projection
  reconstructions:
    - ratio: 2                       # t0 scales ~linearly with ratio (4->160,
      K: 3                           # 8->320, 16->640), so 2 -> 80; K and the
      t_steps: [80, 57, 40]          # 1/sqrt2 decay mirror the 4x arm
    - ratio: 4
      K: 3
      t_steps: [160, 114, 80]
    - ratio: 8
      K: 1
      t_steps: [320]
    - ratio: 16
      K: 1
      t_steps: [640]

eval:
  checkpoint: best.pt
  use_ema: true
  n_test_samples: 16                 # sampling is K*t0 forward passes per field
  batch_size: 2
  ensemble: 1
  lat_bands: [[-90, -60], [-60, -20], [-20, 20], [20, 60], [60, 90]]

wandb:
  enabled: false
  project: dlwp-hpx-sr
  entity: null
  name: null
